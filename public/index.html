<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>毅東工程 Exhaust</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+TC:wght@400;500;600&display=swap">
<style>
/* Layout: sticky search bar over a single reading column; results stack as machine cards, Take off book rows as a dense mono table; edit tools appear as a panel under the bar */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#1b2422; --muted:#5d6a67; --line:#d6dedb;
  --accent:#0d6b63; --accent-soft:#dcefec; --on-accent:#ffffff;
  --ok:#1f7a3f; --ok-bg:#e1f2e6; --bad:#a3361f; --bad-bg:#f8e1da; --info:#5b4a9e; --info-bg:#ebe7f7; --warn:#8a5a00; --warn-bg:#fbefd2;
  --sans:"IBM Plex Sans TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --fg:#e4ebe9; --muted:#97a6a2; --line:#2c3835;
  --accent:#4fbfb3; --accent-soft:#183a36; --on-accent:#0b1413;
  --ok:#7fd49a; --ok-bg:#183323; --bad:#f19a85; --bad-bg:#3d1f18; --info:#b9a8f0; --info-bg:#2a2445; --warn:#e9c06a; --warn-bg:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --fg:#e4ebe9; --muted:#97a6a2; --line:#2c3835;
  --accent:#4fbfb3; --accent-soft:#183a36; --on-accent:#0b1413;
  --ok:#7fd49a; --ok-bg:#183323; --bad:#f19a85; --bad-bg:#3d1f18; --info:#b9a8f0; --info-bg:#2a2445; --warn:#e9c06a; --warn-bg:#3a2e12; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 12px;display:grid;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.brand .grow{flex:1}
.plants{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center}
.plants button{border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;font:600 .9rem var(--sans);cursor:pointer}
.plants button:last-child{border-right:0}
.plants button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
h1{font-size:1.25rem;font-weight:600;margin:0;letter-spacing:.02em}
.src{color:var(--muted);font-size:.8rem}
.searchrow{display:flex;gap:8px;flex-wrap:wrap}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q::-webkit-search-cancel-button{display:none}
.backbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#q{flex:1 1 260px;font:500 1rem var(--mono);padding:10px 12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:500 .82rem var(--sans);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:-12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:600 .9rem var(--sans);padding:8px 14px;white-space:nowrap;flex:0 0 auto;border:0;border-bottom:2.5px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;font:600 .72rem/18px var(--mono);text-align:center}
.jobs{display:grid;gap:18px}
.dayrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dayrow h2{margin:0;flex:1 1 auto}
.jform{background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;padding:14px;display:grid;gap:10px}
.jform .fields{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.ptpick{display:flex;flex-wrap:wrap;gap:6px}
.ptpick label{display:inline-flex;gap:6px;align-items:center;font:.8rem var(--mono);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.ptpick label.isgas{opacity:.55}
.jlist{display:grid;gap:8px}
.job{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.job.done{background:var(--bg)}
.prog{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.prog .btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prog .btn{padding:3px 8px;font-size:.78rem}
.pbar{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%}
.pbar i.hook{background:#2563eb}.pbar i.dehook{background:#b45309}.pbar i.gas{background:#15803d}
.pv{font:600 .82rem var(--mono);min-width:34px}
.pnote{display:flex;gap:6px;margin-top:6px;max-width:560px}
.pnote input{flex:1 1 auto;min-width:0;padding:5px 8px;font-size:.85rem}
.phist{margin-top:4px;font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.phist b{font:600 .78rem var(--mono);color:var(--fg)}
.cal .ev .evn{display:none}
@media (max-width:640px){.cal .ev .evn{display:block;font:.76rem var(--sans);opacity:.85;margin-top:2px}}
.pleg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.pleg i{display:inline-block;width:34px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.calhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.calhead h2{margin:0;flex:1 1 auto}
.kleg{display:flex;flex-wrap:wrap;gap:6px}
.kleg button{display:inline-flex;gap:6px;align-items:center;font:500 .82rem var(--sans);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer}
.kleg button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.kdot{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden}
.cal .wd{font:600 .76rem var(--sans);color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.cal .cell{min-height:112px;padding:4px 5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .cell.out{background:var(--bg)}.cal .cell.out .dn{color:var(--muted);opacity:.6}
.cal .cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font:600 .8rem var(--mono);color:var(--fg);border:0;background:none;padding:1px 2px;text-align:left;cursor:pointer;align-self:flex-start}
.cal .dn small{font:.7rem var(--sans);color:var(--muted);margin-left:4px;display:none}
.cal .ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:3px;padding:2px 5px;font:.72rem/1.25 var(--mono);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.ev.hook,.kdot.hook{border-color:#2563eb;background:#dbeafe}.kdot.hook{background:#2563eb}
.ev.dehook,.kdot.dehook{border-color:#b45309;background:#fef3c7}.kdot.dehook{background:#b45309}
.ev.gas,.kdot.gas{border-color:#15803d;background:#dcfce7}.kdot.gas{background:#15803d}
.cal .ev.done{opacity:.75}
.cal .ev.np{background:transparent!important;border-style:dashed;border-width:1px 1px 1px 3px}
.cal .ev b{font-weight:700}
.cal .more{font-size:.7rem;color:var(--muted);border:0;background:none;text-align:left;padding:0 2px;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev.hook{background:#1e3a8a55}:root:not([data-theme="light"]) .ev.dehook{background:#78350f55}:root:not([data-theme="light"]) .ev.gas{background:#14532d55}}
@media (max-width:640px){.cal{grid-template-columns:1fr}.cal .wd,.cal .cell.noev,.cal .cell.out{display:none}.cal .cell{min-height:0;padding:8px 10px}.cal .dn small{display:inline}.cal .ev{white-space:normal;font-size:.8rem;padding:4px 7px}}
.svl{padding:6px 14px;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line)}
.svl b{color:var(--fg);font-family:var(--mono);font-weight:600}
.svtbl table{width:100%;border-collapse:collapse;font-size:.88rem;table-layout:fixed;min-width:930px}
.svtbl td:nth-child(7),.svtbl td:nth-child(2) .pt{white-space:nowrap}
.svtbl th,.svtbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.svtbl th{font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap}
.svtbl td.d{font-family:var(--mono);white-space:nowrap}
.svtbl tr.done td{color:var(--muted)}
.svtbl .lk{font:.76rem var(--mono);color:var(--muted)}
.svtbl .acts{white-space:nowrap}
.specbtn{margin-top:4px;font-size:.74rem;padding:2px 7px}
.svtbl tr.specrow td{background:var(--bg);padding:10px 12px}
.specg{margin-bottom:10px}
.spech{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:.85rem;margin-bottom:4px}
.spech code{font:600 .8rem var(--mono)}
table.spect{width:100%;border-collapse:collapse;font-size:.8rem;table-layout:auto!important;min-width:760px}
table.spect th,table.spect td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.spect th{font-size:.72rem;color:var(--muted)}
.tumsbox{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
#tumsPrev{flex-basis:100%}
#tumsPrev:empty{display:none}
.spedt td{padding:2px 3px!important}
.spedt input{padding:3px 5px;font:.78rem var(--mono);min-width:0}
.speced{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px}
.vleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.vleg b{color:var(--fg)}
.chip.soon{background:#fef3c7;color:#92400e}.chip.late{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.iso{border-top:1px solid var(--line);padding:10px 14px 12px;display:grid;gap:8px}
.iso a{color:var(--accent)}
.isosearch{display:grid;grid-template-columns:minmax(min(220px,100%),2fr) repeat(2,minmax(min(140px,100%),1fr));gap:8px 10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.isosearch .qk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){.isosearch{grid-template-columns:1fr 1fr}.isosearch label:first-child{grid-column:1/-1}}
.isoact{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mgrp{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:10px}
.mgrp>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;list-style:none;font-size:1rem}
.mgrp>summary::-webkit-details-marker,.mach>summary::-webkit-details-marker{display:none}
.mgrp>summary::before,.mach>summary::before{content:'▸';color:var(--muted);display:inline-block}
.mgrp[open]>summary::before,.mach[open]>summary::before{transform:rotate(90deg)}
.mgrp>.jlist{padding:0 10px 10px;gap:6px}
.mach{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.mach>summary{cursor:pointer;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;list-style:none}
.mach>summary .id{font:600 .95rem var(--mono);color:var(--accent)}
.mach[open]{background:var(--surface)}
.machbody{padding:0 12px 10px;border-top:1px solid var(--line)}
.machbody>.row{padding-top:8px}
.machbody .iso{border-top:0;padding:4px 0 0}
.catsec{display:grid;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.catsec:first-of-type{border-top:0}
.catsec .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vcard>.row{padding:0 14px 12px}
.iso .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.isolist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
.isoit{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start}
.isoit img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#fff}
.isodoc{display:grid;place-items:center;width:72px;height:72px;border:1px solid var(--line);border-radius:4px;font:600 .9rem var(--mono);color:var(--accent);text-decoration:none;background:var(--bg)}
.isobtn{cursor:pointer}
.chip.isoc{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.days{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.dchip{display:inline-flex;gap:4px;align-items:center;font:.74rem var(--mono);padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.dchip.cur{border-color:var(--accent);color:var(--accent);font-weight:600}
.dchip button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:.8rem}
.addday{display:inline-flex;gap:4px;align-items:center}
.addday input{padding:3px 6px;font-size:.8rem}
.kind{display:inline-block;font:600 .74rem var(--sans);padding:1px 8px;border-radius:4px;margin-right:6px;vertical-align:2px;border:1px solid currentColor}
.kind.hook{color:#2563eb}.kind.dehook{color:#b45309}.kind.gas{color:var(--accent)}
.chip.unappr{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.kseg{display:inline-flex;justify-self:start;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kseg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:7px 16px;font:600 .88rem var(--sans);color:var(--fg);cursor:pointer}
.kseg button:last-child{border-right:0}
.kseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.items label{display:inline-flex;gap:5px;align-items:center;font:.82rem var(--sans);padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.warn{border:1px dashed var(--bad);border-radius:6px;padding:8px 10px;color:var(--bad);font-size:.85rem}
.job .tm{font:600 1.05rem var(--mono);font-variant-numeric:tabular-nums}
.job .tm small{display:block;font:.72rem var(--sans);color:var(--muted)}
.job .who{font:600 1rem var(--mono)}
.job .pts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.job .pts span{font:.74rem var(--mono);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.job.done .pts span{border-color:var(--accent);color:var(--accent)}
.job .jdone{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chk{display:inline-flex;gap:8px;align-items:center;font:600 .9rem var(--sans);padding:7px 12px;border:1.5px solid var(--accent);border-radius:6px;cursor:pointer;color:var(--accent);background:var(--surface)}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.job.done .chk{background:var(--accent);color:var(--on-accent)}
@media (max-width:560px){.job{grid-template-columns:1fr}.job .jdone{align-items:flex-start;flex-direction:row;flex-wrap:wrap}}
.fsep{width:1px;background:var(--line);margin:2px 4px}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{font:500 .85rem var(--sans);padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{font-size:.76rem;padding:3px 9px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,.mrow:focus-visible,.pt:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 48px;display:grid;gap:26px}
h2{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 .count{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--fg)}
h3{font-size:1rem;margin:0 0 6px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.chip{display:inline-block;font-size:.74rem;font-weight:500;padding:1px 8px;border-radius:4px;white-space:nowrap}
.ok{color:var(--ok);background:var(--ok-bg)} .unreg{color:var(--bad);background:var(--bad-bg)} .missing{color:var(--info);background:var(--info-bg)} .fixed{color:var(--warn);background:var(--warn-bg)} .na{color:var(--muted);background:var(--bg);border:1px solid var(--line)}
.oldtag{color:var(--muted);border:1px solid var(--line)}

.vcard .chead{align-items:center}

.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.74rem;letter-spacing:.06em;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.code{font-family:var(--mono);white-space:nowrap}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hit td{background:var(--accent-soft)}
.pt{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.where{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
.btable{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.btable td.tool{font-family:var(--mono)}
.shot{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);display:grid;gap:8px}
.shot figcaption,.shot summary{font-size:.8rem;color:var(--muted)}
.shot summary{cursor:pointer;color:var(--accent)}
.shot[open] summary{margin-bottom:8px}
.shot img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
.more{font-size:.8rem;color:var(--muted);padding:8px 12px}
/* edit panel */
.panel{background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;padding:14px;display:grid;gap:14px}
.panel .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
main .wrap>*,#out>*,section,.card,.panel,.tool,.queue{min-width:0}
.mlist{grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))}
.tool{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.tool p{margin:0;font-size:.84rem;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:.85rem;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.msg{font-size:.84rem;padding:8px 10px;border-radius:6px;background:var(--bg)}
.msg.err{color:var(--bad);background:var(--bad-bg)} .msg.good{color:var(--ok);background:var(--ok-bg)}
.queue{display:grid;gap:12px}
.qitem{border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0}
.qitem .qimg{padding:10px;border-right:1px solid var(--line);background:var(--bg);min-width:0}
.qitem .qimg img{border:1px solid var(--line);border-radius:4px}
.qitem.zoom{grid-template-columns:1fr}.qitem.zoom .qimg{border-right:0;border-bottom:1px solid var(--line)}
.qitem .qform{padding:12px;display:grid;gap:8px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label.f{display:grid;gap:3px;font-size:.76rem;color:var(--muted)}
label.f input,label.f textarea{font-size:.9rem;color:var(--fg)}
textarea.pts{font-family:var(--mono);font-size:.82rem;min-height:120px;resize:vertical}
details.raw summary{font-size:.78rem;color:var(--muted);cursor:pointer}
details.raw pre{white-space:pre-wrap;font:.76rem/1.5 var(--mono);background:var(--bg);padding:8px;border-radius:6px;margin:6px 0 0;max-height:220px;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px}
.modal form{background:var(--surface);border-radius:10px;padding:18px;width:min(360px,100%);display:grid;gap:10px;border:1px solid var(--line)}
@media (max-width:720px){.qitem{grid-template-columns:1fr}.qitem .qimg{border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:560px){th,td{padding:6px 8px}.chead{padding:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>毅東工程 Exhaust</h1>
      <div class="plants" role="group" aria-label="切換廠區">
        <button type="button" data-plant="F16">后里 F16</button>
        <button type="button" data-plant="TL">銅鑼廠</button>
      </div>
      <span class="src" id="srcline">載入中…</span>
      <span class="grow"></span>
      <button type="button" class="btn small" id="editBtn">編輯</button>
    </div>
    <nav class="tabs" aria-label="頁面">
      <button type="button" data-view="cal">總覽</button>
      <button type="button" data-view="jobs">每日施工 <span class="badge" id="jobBadge" hidden></span></button>
      <button type="button" data-view="iso">已完工機台 <span class="badge" id="isoBadge" hidden></span></button>
      <button type="button" data-view="survey">會勘紀錄</button>
      <button type="button" data-view="query">查詢</button>
    </nav>
    <div id="queryCtl" style="display:grid;gap:10px">
    <div class="searchrow">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="輸入機台名稱、MICAP 或點位，例：KTINL46800、R1-GEX(S)-L20" aria-label="查詢機台或點位">
      <button type="button" class="btn" id="qClear" hidden>✕ 清除</button>
    </div>
    <div class="filters" role="group" aria-label="篩選">
      <button type="button" data-area="all" aria-pressed="true">全部棟別</button>
      <span id="areaBtns" style="display:contents"></span>
      <span class="fsep" aria-hidden="true"></span>
      <button type="button" data-f="all" aria-pressed="true">全部</button>
      <button type="button" data-f="build" aria-pressed="false">裝機中</button>
      <button type="button" data-f="demo" aria-pressed="false">拆機中</button>
      <button type="button" data-f="gasyes" aria-pressed="false">已送氣</button>
      <button type="button" data-f="gasno" aria-pressed="false">未送氣</button>
      <button type="button" data-f="todo" aria-pressed="false">有待確認點位</button>
      <button type="button" data-f="old" aria-pressed="false">含舊版</button>
    </div>
    </div>
  </div>
</header>

<main><div class="wrap">
  <section id="editPanel" hidden>
    <div class="panel">
      <div class="row"><h3 style="margin:0">編輯模式</h3><span class="src" id="editState"></span><span style="flex:1"></span><button type="button" class="btn small" id="logoutBtn">結束編輯</button></div>
      <div class="grid2">
        <div class="tool">
          <h3>新增核准截圖</h3>
          <p>選擇或拖進 LINE 存下來的核准截圖，可一次多張。重複的截圖會自動略過，其餘由 AI 讀出機台與點位，你確認後再存檔。</p>
          <label class="drop" id="dropImg" for="fileImg">點這裡選擇截圖，或把圖片拖進來</label>
          <input type="file" id="fileImg" accept="image/*" multiple hidden>
        </div>
        <div class="tool">
          <h3>更新族譜（Take off book）</h3>
          <p>上傳新版 A1 或 A2 EXHAUST TAKE OFF BOOK.xlsx，會取代該廠區的族譜資料並重新核對。上傳前會先顯示核對結果的變化。</p>
          <label class="drop" id="dropBook" for="fileBook">點這裡選擇 Excel 檔</label>
          <input type="file" id="fileBook" accept=".xlsx,.xls" multiple hidden>
          <div id="bookMsg"></div>
        </div>
      </div>
      <div class="queue" id="queue"></div>
    </div>
  </section>
  <div id="out" style="display:grid;gap:26px"></div>
  <section id="jobsView" hidden></section>
  <section id="isoView" hidden></section>
  <section id="svyView" hidden></section>
  <section id="calView" hidden></section>
</div></main>

<div class="modal" id="loginModal" hidden>
  <form id="loginForm">
    <h3>輸入編輯密碼</h3>
    <p class="src" style="margin:0">密碼是你在 Cloudflare 專案設定的 EDIT_PASSWORD。</p>
    <input type="password" id="pw" autocomplete="current-password" aria-label="編輯密碼">
    <div id="loginMsg"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="loginCancel">取消</button><button type="submit" class="btn primary">進入編輯</button></div>
  </form>
</div>

<script src="core.js"></script>
<script>
// ── 廠區：后里 F16（原本的資料）／銅鑼廠（TL）。每個廠的資料完全分開。
const PLANTS={F16:'后里 F16',TL:'銅鑼廠'};
const PLANT=(()=>{let p=new URLSearchParams(location.search).get('plant');if(!p){try{p=localStorage.getItem('exq-plant')}catch(e){}}p=String(p||'F16').toUpperCase();return p in PLANTS?p:'F16'})();
try{localStorage.setItem('exq-plant',PLANT)}catch(e){}
const PQ=PLANT==='F16'?'':'?p='+PLANT; // 給 <img>、連結用（沒辦法帶標頭）
(()=>{const _f=window.fetch.bind(window);window.fetch=(u,o={})=>{const s=String(u&&u.url||u);
  if(/^\/?api\//.test(s)||s.startsWith(location.origin+'/api/')){const h=new Headers(o.headers||{});h.set('x-plant',PLANT);o={...o,headers:h}}return _f(u,o)}})();
document.title=`毅東工程 Exhaust · ${PLANTS[PLANT]}`;
document.querySelectorAll('[data-plant]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.plant===PLANT));
  b.addEventListener('click',()=>{if(b.dataset.plant===PLANT)return;try{localStorage.setItem('exq-plant',b.dataset.plant)}catch(e){}const u=new URL(location.href);u.searchParams.delete('plant');history.replaceState(null,'',u.pathname+u.search+u.hash);location.reload()})});
const SKEY=PLANT==='F16'?'exq':'exq-'+PLANT;
const LABEL={ok:'吻合',unreg:'族譜未登記此機台',missing:'族譜查無此點位',na:'不核對族譜'};
const NOBOOK=new Set(['A3']); // 后里 F16 這些棟別不核對族譜；其他廠在還沒有族譜時一律不核對
const noBook=area=>PLANT==='F16'?NOBOOK.has((String(area||'').match(/^A\d/)||[''])[0]):!(D.book&&D.book.length);
const stat=(tool,area,pt,idx)=>noBook(area)?{s:'na',rows:[],ovr:null,how:''}:EXQ.status(tool,pt,idx,D.ovr);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v==null||v===''?'—':(+v).toString();
const norm=s=>String(s||'').toUpperCase().replace(/\s+/g,'');
const $=id=>document.getElementById(id);
let D={appr:[],book:[],ovr:{},meta:{}},I=null,EDIT=null,SERVER={};
const state={q:'',f:'all',area:'all',old:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'{}');Object.assign(state,{q:s.q||'',f:['all','todo','gasyes','gasno'].includes(s.f)?s.f:'all',area:s.area||'all',old:!!s.old})}catch(e){}
try{EDIT=sessionStorage.getItem('exq-key')}catch(e){}
$('q').value=state.q;

async function load(){
  let data=null;
  try{const r=await fetch('api/data',{cache:'no-store'});if(r.ok){data=await r.json();SERVER=data}}catch(e){}
  if(!data&&PLANT==='F16'){try{data=await (await fetch('data.json')).json()}catch(e){}}
  if(!data){$('out').innerHTML='<div class="empty">資料載入失敗，請重新整理頁面。</div>';return}
  D=data;prepare();
}
// 剛變更的送氣／修正標記，伺服器同步約需 1 分鐘，期間以本機變更為準
const PEND={gas:{},ovr:{},iso:{}},PEND_MS=120000;
function applyPending(){const now=Date.now();D.iso=D.iso||{};
  for(const[k,p]of Object.entries(PEND.iso)){if(now-p.t>PEND_MS){delete PEND.iso[k];continue}if(p.v)D.iso[k]=p.v;else delete D.iso[k]}
  for(const[id,p]of Object.entries(PEND.gas)){if(now-p.t>PEND_MS){delete PEND.gas[id];continue}const a=D.appr.find(x=>String(x.id)===id);if(a)a.gas=p.v}
  for(const[k,p]of Object.entries(PEND.ovr)){if(now-p.t>PEND_MS){delete PEND.ovr[k];continue}D.ovr=D.ovr||{};if(p.v)D.ovr[k]=p.v;else delete D.ovr[k]}}
function prepare(){
  applyPending();
  I=EXQ.buildIndex(D.book);
  D.book.forEach(b=>{b.P=norm(b[0]);b.T=norm(b[1])});
  D.appr.forEach(a=>{
    a.T=norm(a.t);a.P=a.p.map(p=>norm(p[0]));
    a.st=a.p.map(p=>stat(a.t,a.a,p[0],I));
    a.cnt={ok:0,unreg:0,missing:0,na:0};a.st.forEach(s=>a.cnt[s.s]++);a.todo=a.cnt.unreg+a.cnt.missing;
    a.pg=a.p.map(p=>{const g=(D.gasp||{})[a.id+'|'+EXQ.codeKey(p[0])];return g&&g.v==='yes'?g:null});a.pgN=a.pg.filter(Boolean).length;
    a.gasBase=a.gas==='yes'||(a.p.length&&a.pgN===a.p.length)?'yes':'no';a.gasSt=a.gasBase;
  });
  const bm=D.meta&&D.meta.book||{};
  const bks=Object.keys(bm).sort();const bd=bks.map(k=>bm[k]&&bm[k].date?`${k} ${bm[k].date.slice(0,10)}`:'').filter(Boolean).join('、');
  $('srcline').textContent=PLANT==='F16'?`核准 ${D.appr.length} 張 × A1／A2 Take off book（${bd?'更新：'+bd:'2026/10/28 版'}）`
    :`核准 ${D.appr.length} 張 · ${D.book.length?`族譜 ${bks.join('／')||''}${bd?'（更新：'+bd+'）':''}`:'尚未上傳族譜'}`;
  const ars=[...new Set(D.appr.map(areaOf))].filter(x=>x!=='其他').sort();if(state.area!=='all'&&!ars.includes(state.area))state.area='all';
  $('areaBtns').innerHTML=ars.map(x=>`<button type="button" data-area="${esc(x)}" aria-pressed="${state.area===x}">${esc(x)}</button>`).join('');
  render();
}
function label(a){return a.n?`第 ${a.n} 張`:`${String(a.added||'').slice(0,10)} 上傳`}
function oldText(a){const r=D.appr.find(x=>String(x.id)===String(a.old)||String(x.n)===String(a.old));return r?`舊版，以${label(r)}為準`:`舊版，以 ${a.old} 為準`}
function syncBtns(){document.querySelectorAll('#queryCtl .filters button').forEach(b=>{if(b.dataset.area){b.setAttribute('aria-pressed',String(state.area===b.dataset.area));return}const f=b.dataset.f;b.setAttribute('aria-pressed',f==='old'?String(state.old):String(state.f===f))})}
const areaOf=a=>(String(a.a||'').toUpperCase().match(/^[A-Z]+\d+/)||['其他'])[0];
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state))}catch(e){}}
function bar(c,n){return '<div class="bar" aria-hidden="true">'+['ok','unreg','missing','na'].map(k=>c[k]?`<i class="b-${k}" style="width:${c[k]/n*100}%"></i>`:'').join('')+'</div>'}
function summary(c){return ['ok','unreg','missing','na'].filter(k=>c[k]).map(k=>`<span class="chip ${k}">${LABEL[k]} ${c[k]}</span>`).join(' ')}
function passFilter(a){if(!state.old&&a.old)return false;if(state.f==='todo'&&!a.todo)return false;if(state.area!=='all'&&areaOf(a)!==state.area)return false;if(state.f==='gasyes'&&a.gasSt!=='yes')return false;if(state.f==='gasno'&&a.gasSt!=='no')return false;if((state.f==='build'||state.f==='demo')&&a.gasSt!==state.f)return false;return true}
const GASL={yes:'已送氣',no:'未送氣',build:'裝機中',demo:'拆機中',gone:'已拆機'};const GORD={build:0,demo:1,no:2,yes:3,gone:4};const SITE=['hook','dehook'];
// 裝機排程：未完成＝施工中；完成後回到送氣狀態（未送氣）。沒有核准截圖的機台也列入，標「點位未核准」
const ord=(x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||''));
function siteJobs(tool){const k=norm(tool).replace(/\(.*$/,'');return (typeof JOBS!=='undefined'?JOBS:[]).filter(j=>SITE.includes(j.kind)&&(norm(j.tool).replace(/\(.*$/,'')===k||(j.apprId&&D.appr.some(a=>String(a.id)===String(j.apprId)&&norm(a.t)===norm(tool))))).sort(ord)}
// 未完成的裝機／拆機＝裝機中／拆機中；最後完成的是拆機＝已拆機；其餘依送氣狀態
function siteState(a,jobs,base){const pend=jobs.filter(j=>!j.done);a.hook=pend[0]||null;a.built=jobs.find(j=>j.kind==='hook'&&j.done)||null;
  if(a.hook)return a.hook.kind==='hook'?'build':'demo';const last=jobs.filter(j=>j.done).sort((x,y)=>ord(x,y)||String(x.doneAt).localeCompare(String(y.doneAt))).pop();
  return last&&last.kind==='dehook'?'gone':base}
function applyJobState(){
  for(const a of D.appr)a.gasSt=siteState(a,siteJobs(a.t),a.gasBase);
  const m=new Map();
  for(const j of (typeof JOBS!=='undefined'?JOBS:[])){if(!SITE.includes(j.kind)||jobAppr(j))continue;const k=norm(j.tool);const v=m.get(k)||{id:'v:'+k,virt:true,t:j.tool,a:'',f:'',mod:'',m:'',p:[],P:[],T:k,st:[],cnt:{ok:0,unreg:0,missing:0,na:0},todo:0,pg:[],pgN:0,jobs:[]};
    v.jobs.push(j);if(j.area)v.a=j.area;if(j.floor)v.f=j.floor;m.set(k,v)}
  D.virt=[...m.values()];for(const v of D.virt){v.jobs.sort(ord);v.gasSt=siteState(v,v.jobs,'no')}}
const DAYS=j=>j.days&&j.days.length?j.days:[j.date];const md=d=>d.slice(5).replace('-','/');
const tkey=t=>norm(t).replace(/\(.*$/,'');
const CATL={iso:'ISO 圖',lego:'樂高圖'};
function isoFor(t,c){const k=tkey(t);return Object.entries(D.iso||{}).filter(([,m])=>tkey(m.t)===k&&(!c||(m.c||'iso')===c)).map(([id,m])=>({id,...m})).sort((x,y)=>String(x.at).localeCompare(String(y.at)))}
const fsz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function isoItem(f){const u='api/iso/'+f.id+PQ,img=/^image\//.test(f.y||'');
  return `<div class="isoit">${img?`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" loading="lazy" alt="${esc(f.n)}"></a>`:`<a class="isodoc" href="${u}" target="_blank" rel="noopener">${esc((String(f.n).split('.').pop()||'檔').toUpperCase().slice(0,4))}</a>`}
   <div class="src" style="min-width:0"><a href="${u}" target="_blank" rel="noopener" style="word-break:break-all">${esc(f.n)}</a><br>${esc(String(f.at||'').slice(0,10))} · ${fsz(f.s||0)}${f.by?' · '+esc(f.by):''}<div class="isoact"><span data-isotw="${esc(f.id)}"><button class="btn small" data-isotask="${esc(f.id)}" data-t="${esc(f.t)}">改機台</button></span><button class="btn small danger" data-isodel="${esc(f.id)}">刪除</button></div></div></div>`}
function isoUp(t,label,c='iso'){return `<label class="btn small primary isobtn">${label||'匯入 '+CATL[c]}<input type="file" hidden multiple accept="image/*,.pdf,.dxf,.dwg" data-isoup="${esc(t)}" data-cat="${c}"></label>`}
function catSec(t,c,built){const L=isoFor(t,c);return `<div class="catsec"><div class="row"><b>${CATL[c]}</b>${L.length?`<span class="chip isoc">${L.length} 張</span>`:(built?'<span class="chip unappr">待匯入</span>':'<span class="count">未上傳</span>')}${isoUp(t,(L.length?'加傳':'上傳')+(c==='iso'?' ISO 圖':'樂高圖'),c)}${L.length?'<span class="src">可一次選多個檔案</span>':''}</div>${L.length?`<div class="isolist">${L.map(isoItem).join('')}</div>`:''}</div>`}
const fcount=t=>({iso:isoFor(t,'iso').length,lego:isoFor(t,'lego').length});
function fchips(t,built){const n=fcount(t);return ['iso','lego'].map(c=>n[c]?` <span class="chip isoc">${c==='iso'?'ISO':'樂高'} ${n[c]}</span>`:(built?` <span class="chip unappr">待匯入${c==='iso'?' ISO':'樂高'}</span>`:'')).join('')}
function isoBlock(a){return `<section class="iso"><div class="row"><b>完工圖檔</b><span class="src">照片、PDF、DXF 或 DWG，每個檔案 20MB 以內</span><span class="src" data-isomsg="${esc(tkey(a.t))}"></span></div>${catSec(a.t,'iso',a.built)}${catSec(a.t,'lego',a.built)}</section>`}
// 完成程度（累計 %）：當天有填用當天，沒填沿用前一個工作日；勾完成＝100%
function pctAt(j,d){if(j.done&&d>=DAYS(j)[DAYS(j).length-1])return 100;const P=j.prog||{};if(P[d]!=null)return P[d];
  if(d>todayStr())return null;const prev=Object.keys(P).filter(x=>x<d).sort().pop();if(prev!=null)return P[prev];return null}

async function call(path,method,body){
  const r=await fetch(path,{method,headers:{'content-type':'application/json','x-edit-key':EDIT||''},body:body?JSON.stringify(body):undefined});

}

/* ---------- screenshot upload ---------- */
function setupDrop(zone,input,handler){
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');handler([...e.dataTransfer.files])});
  input.addEventListener('change',()=>{handler([...input.files]);input.value=''});
}

async function sha256(buf){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function toJpeg(file,max=1600){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);const url=c.toDataURL('image/jpeg',0.85);URL.revokeObjectURL(img.src);res(url)};img.onerror=()=>rej(new Error('圖片讀取失敗'));img.src=URL.createObjectURL(file)})}
let qn=0;

    if(dup){form.innerHTML=`<div class="msg">重複的截圖，已略過（與 ${esc(dup.t)}・${esc(label(dup))} 相同）。</div><div><button class="btn small" data-x>移除</button></div>`;form.querySelector('[data-x]').onclick=()=>el.remove();return}
    form.innerHTML='<div class="msg">AI 辨識中，約 10–30 秒…</div>';
    let r={text:'',errors:[]};

function parsePts(t){return t.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.lastIndexOf('@');return i>0?[s.slice(0,i).trim(),s.slice(i+1).trim()]:[s,'']})}

/* ---------- book upload ---------- */
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Excel 讀取元件載入失敗'));document.head.appendChild(s)})}
async function parseBook(file){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const rows=[];let area=(file.name.toUpperCase().match(/A\d/)||[''])[0];
  for(const name of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    if(!a.length||String(a[0][0]||'').trim()!=='Sub-main NO.')continue;
    const hdr=a[0].map(h=>String(h||'').replace(/\s+/g,''));
    const it=hdr.indexOf('TAKEOFF編號'),im=hdr.indexOf('機台碼'),ic=hdr.indexOf('TMS-CMM');
    if(it<0||im<0)continue;
    for(const r of a.slice(1)){
      const code=r[it];if(code==null||String(code).trim()==='')continue;
      const raw=String(code).split('\n')[0].trim();
      if(!area){if(/^R1-/i.test(raw))area='A1';else{const m=raw.match(/^(A\d)-/i);if(m)area=m[1].toUpperCase()}}
      let c=r[ic];c=(c==null||c===''||isNaN(+c))?null:Math.round(+c*1e4)/1e4;
      rows.push([raw,String(r[im]??'').trim(),c,null,name]);
    }
  }
  if(!area)throw new Error(file.name+'：無法判斷是哪個廠區，請在檔名加上 A1、A2 或 A3。');
  if(!rows.length)throw new Error(file.name+'：找不到 Take off 資料（工作表第一格應為 Sub-main NO.）。');
  rows.forEach(r=>{r[3]=area+'/'+r[4];r.length=4});
  const seen=new Set();const uniq=rows.filter(r=>{const k=r.join('|');if(seen.has(k))return false;seen.add(k);return true});
  return {area,rows:uniq};
}
async function handleBook(files){
  const box=$('bookMsg');box.innerHTML='<div class="msg">讀取 Excel 中…</div>';
  try{
    await loadXLSX();
    const parts=[];for(const f of files)parts.push(await parseBook(f));
    const areas=[...new Set(parts.map(p=>p.area))];
    const newRows=parts.flatMap(p=>p.rows);
    const merged=D.book.filter(b=>!areas.some(ar=>String(b[3]).startsWith(ar+'/'))).map(b=>[b[0],b[1],b[2],b[3]]).concat(newRows);
    const I2=EXQ.buildIndex(merged);
    let better=0,worse=0,still=0;
    for(const a of D.appr){if(a.old)continue;a.p.forEach((p,i)=>{if(a.st[i].s==='na')return;const s1=a.st[i].s,s2=EXQ.status(a.t,p[0],I2,D.ovr).s;if(s1!=='ok'&&s2==='ok')better++;else if(s1==='ok'&&s2!=='ok')worse++;else if(s2!=='ok')still++})}
    box.innerHTML=`<div class="msg">${areas.join('、')} 族譜共 ${newRows.length} 筆登記。換成新版後：<b>${better}</b> 個待確認點位變成吻合，<b>${worse}</b> 個原本吻合的點位變成待確認，仍待確認 ${still} 個。</div><div class="row" style="margin-top:8px"><button class="btn primary" id="bookGo">更新族譜</button><button class="btn" id="bookNo">取消</button><span class="src" id="bookSt"></span></div>`;
    $('bookNo').onclick=()=>box.innerHTML='';
    $('bookGo').onclick=async()=>{$('bookGo').disabled=true;$('bookSt').textContent='上傳中…';
      try{await call('api/book','POST',{rows:newRows,areas,source:files.map(f=>f.name).join('、')});await reload();box.innerHTML=`<div class="msg good">已更新 ${areas.join('、')} 族譜。</div>`}
      catch(err){$('bookSt').textContent=err.message;$('bookGo').disabled=false}};
  }catch(err){box.innerHTML=`<div class="msg err">${esc(err.message)}</div>`}
}

function renderCal(){const [Y,M]=state.calM.split('-').map(Number);const first=new Date(Y,M-1,1),start=new Date(first);start.setDate(1-first.getDay());
  const days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d.toLocaleDateString('sv-SE'))}
  while(days.length>35&&days.slice(-7).every(d=>d.slice(0,7)!==state.calM))days.splice(-7);
  const by={};const inMonth={hook:new Set(),dehook:new Set(),gas:new Set()};
  for(const j of JOBS){const k=j.kind||'gas';const ds=DAYS(j);ds.forEach((d,i)=>{(by[d]=by[d]||[]).push({j,k,i,n:ds.length});if(d.slice(0,7)===state.calM)inMonth[k].add(j.id)})}
  const t=todayStr(),MAX=4;
  const KC={hook:'37,99,235',dehook:'180,83,9',gas:'21,128,61'};
  const ev=x=>{const dd=DAYS(x.j)[x.i],p=pctAt(x.j,dd),c=KC[x.k];const st=p==null?'':`background:linear-gradient(90deg,rgba(${c},${p>=100?.55:.38}) ${p}%,rgba(${c},.08) ${p}%)`;
    return `<button class="ev ${x.k}${x.j.done?' done':''}${p==null?' np':''}" style="${st}" data-calday="${esc(dd)}" title="${esc(KIND[x.k]+' '+x.j.tool+(x.n>1?`（第 ${x.i+1}/${x.n} 天）`:'')+' · 完成程度 '+(p==null?'未填':p+'%')+((x.j.pnote||{})[dd]?' · 備註：'+x.j.pnote[dd]:'')+(x.j.done?' · 已完成':'')+(x.j.area?' · '+x.j.area:''))}">${x.j.done?'✓ ':''}${p!=null&&!x.j.done?`<b>${p}%</b> `:''}${esc(KIND[x.k])} ${esc(x.j.tool)}${x.n>1?` ${x.i+1}/${x.n}`:''}${(x.j.pnote||{})[dd]?` ✎<span class="evn">${esc(x.j.pnote[dd])}</span>`:''}</button>`};
  const cell=d=>{const L=(by[d]||[]).filter(x=>state.calK[x.k]).sort((a,b)=>(a.j.done-b.j.done)||(a.j.time||'99').localeCompare(b.j.time||'99'));const out=d.slice(0,7)!==state.calM;const dt=new Date(d+'T00:00:00');
    return `<div class="cell${out?' out':''}${d===t?' today':''}${L.length?'':' noev'}"><button class="dn" data-calday="${d}">${dt.getDate()}<small>${dt.getMonth()+1}/${dt.getDate()}（${WD[dt.getDay()]}）${d===t?' 今天':''}</small></button>
     ${L.slice(0,MAX).map(ev).join('')}${L.length>MAX?`<button class="more" data-calday="${d}">還有 ${L.length-MAX} 筆…</button>`:''}</div>`};
  const any=days.some(d=>d.slice(0,7)===state.calM&&(by[d]||[]).some(x=>state.calK[x.k]));
  $('calView').innerHTML=`<div class="jobs"><div class="calhead"><h2>總覽 <span class="count">${Y} 年 ${M} 月 · ${Object.keys(KIND).map(k=>`${KIND[k]} ${inMonth[k].size}`).join(' · ')}</span></h2>
    <button class="btn small" data-calm="-1">上個月</button><button class="btn small" data-calm="0">本月</button><button class="btn small" data-calm="1">下個月</button></div>
   <div class="kleg" role="group" aria-label="顯示類別">${Object.keys(KIND).map(k=>`<button type="button" data-calk="${k}" aria-pressed="${state.calK[k]}"><span class="kdot ${k}"></span>${KIND[k]}</button>`).join('')}<span class="src" style="align-self:center">點日期或排程可開啟當天的每日施工</span></div>
   <div class="pleg"><span>完成程度：</span><span><i style="background:transparent;border:1px dashed var(--muted)"></i>未填</span><span><i style="background:linear-gradient(90deg,rgba(37,99,235,.38) 25%,rgba(37,99,235,.08) 25%)"></i>25%</span><span><i style="background:linear-gradient(90deg,rgba(37,99,235,.38) 50%,rgba(37,99,235,.08) 50%)"></i>50%</span><span><i style="background:linear-gradient(90deg,rgba(37,99,235,.38) 75%,rgba(37,99,235,.08) 75%)"></i>75%</span><span><i style="background:rgba(37,99,235,.55)"></i>100%／完成 ✓</span><span>（顏色依類別：裝機藍、拆機橘、送氣綠）</span></div>
   <div class="cal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${days.map(cell).join('')}</div>
   ${any?'':'<div class="empty">這個月沒有排程。</div>'}</div>`}

  const kb=e.target.closest('[data-kind]');if(kb){FORM.kind=kb.dataset.kind;FORM.pts=null;renderJobs();return}
  const pa=e.target.closest('[data-pkall]');if(pa){const a=D.appr.find(x=>String(x.id)===String(FORM.apprId));if(a){FORM.pts=new Set(pa.dataset.pkall==='1'?a.p.map(p=>EXQ.codeKey(p[0])):[]);$('jfPts').innerHTML=ptPicker()}return}
  const gq=e.target.closest('[data-goq]');if(gq){state.view='query';state.q=gq.dataset.goq;$('q').value=state.q;history.replaceState(null,'','#query');save();render();window.scrollTo({top:0});return}
  const del=e.target.closest('[data-jdel]');if(del){const id=del.dataset.jdel;if(del.dataset.confirm!=='1'){del.dataset.confirm='1';del.textContent='再按一次確定刪除';return}
    del.disabled=true;try{const j=JOBS.find(x=>x.id===id);await call('api/jobs/'+id,'DELETE');PEND.jobs[id]={job:null,t:Date.now()};JOBS=applyJobPending(JOBS);
      if(j&&j.done&&(j.kind||'gas')==='gas'&&j.apprId){const at=new Date().toISOString();for(const c of j.points)PEND.gasp[j.apprId+'|'+c]={v:'no',at,t:Date.now()}}prepare();updBadge()}
    catch(err){del.disabled=false;del.textContent='失敗：'+err.message}return}
});
async function savePnote(id,d){const inp=document.querySelector(`[data-jpn="${CSS.escape(id)}"][data-d="${d}"]`);if(!inp)return;const m=document.querySelector(`[data-jmsg="${CSS.escape(id)}"]`);inp.disabled=true;
  try{const r=await call('api/jobs/'+id,'PATCH',{pnote:{d,t:inp.value}});PEND.jobs[id]={job:r.job,t:Date.now()};JOBS=applyJobPending(JOBS);renderJobs();const m2=document.querySelector(`[data-jmsg="${CSS.escape(id)}"]`);if(m2)m2.textContent='備註已儲存'}
  catch(err){inp.disabled=false;if(m)m.textContent=err.message}}
$('jobsView').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.jpn){e.preventDefault();savePnote(e.target.dataset.jpn,e.target.dataset.d)}});
$('jobsView').addEventListener('submit',async e=>{e.preventDefault();const msg=$('jfMsg');
  const a=FORM.apprId&&D.appr.find(x=>String(x.id)===String(FORM.apprId));
  if(!FORM.tool){msg.textContent='請輸入機台。';return}if(!FORM.date){msg.textContent='請選擇日期。';return}
  if(a&&FORM.kind==='gas'&&(!FORM.pts||!FORM.pts.size)){msg.textContent='請至少勾選一個送氣點位。';return}
  const btn=e.target.querySelector('[type=submit]');btn.disabled=true;msg.textContent='新增中…';
  const body={kind:FORM.kind,date:FORM.date,time:FORM.time,apprId:a?a.id:'',tool:a?a.t:FORM.tool,area:FORM.area||(a?a.a:''),floor:FORM.floor,col:FORM.col,vendor:FORM.vendor,items:[...FORM.items],points:a&&FORM.pts?[...FORM.pts]:[],note:FORM.note};
  try{const old=FORM.editId&&JOBS.find(x=>x.id===FORM.editId);const r=FORM.editId?await call('api/jobs/'+FORM.editId,'PATCH',body):await call('api/jobs','POST',body);
    if(old&&old.done&&(old.kind||'gas')==='gas'&&old.apprId){const at=new Date().toISOString();for(const c of old.points)PEND.gasp[old.apprId+'|'+c]={v:'no',at,t:Date.now()};
      const nj=r.job;if((nj.kind||'gas')==='gas'&&nj.apprId)for(const c of nj.points)PEND.gasp[nj.apprId+'|'+c]={v:'yes',at,job:nj.id,t:Date.now()};prepare()}
    const wasEdit=!!FORM.editId;
    PEND.jobs[r.job.id]={job:r.job,t:Date.now()};JOBS=applyJobPending(JOBS);state.day=FORM.date;FORM=blankForm({kind:FORM.kind,date:FORM.date,vendor:FORM.vendor});updBadge();renderJobs();
    const m=$('jfMsg');if(m)m.textContent=`${wasEdit?'已修改':'已新增'}：${KIND[r.job.kind]} ${r.job.tool}${r.job.apprId?'':'（點位未核准）'}`}
  catch(err){msg.textContent=err.message;btn.disabled=false}
});
function clearQ(){state.q='';$('q').value='';save();render();window.scrollTo({top:0})}
$('qClear').addEventListener('click',()=>{clearQ();$('q').focus()});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;if(b.dataset.view==='query'){state.q='';$('q').value='';save()}state.view=b.dataset.view;
  if(state.view!=='query'){history.replaceState(null,'','#'+state.view);loadJobs();if(state.view==='survey')loadSvy()}else history.replaceState(null,'','#query');render();window.scrollTo({top:0})});
window.addEventListener('hashchange',()=>{state.view=viewOfHash();render()});
$('out').addEventListener('click',e=>{const gj=e.target.closest('[data-gojobs]');if(gj){state.view='jobs';state.day=gj.dataset.gojobs;FORM.date=state.day;history.replaceState(null,'','#jobs');render();window.scrollTo({top:0});return}
  const s=e.target.closest('[data-sched]');if(!s)return;const a=D.appr.find(x=>String(x.id)===s.dataset.sched);if(!a)return;
  FORM=blankForm({tool:a.t,apprId:String(a.id),area:a.a,date:state.day||todayStr()});state.view='jobs';history.replaceState(null,'','#jobs');render();window.scrollTo({top:0});
  setTimeout(()=>{const f=$('jobForm');if(f)f.scrollIntoView({behavior:'smooth'})},50)});

document.addEventListener('change',async e=>{const inp=e.target.closest('[data-isoup]');if(!inp||!inp.files.length)return;const isNew=!inp.dataset.isoup;
  const t=inp.dataset.isoup||(($('isoNewT')||{}).value||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!t){$('isoNewMsg').textContent='請先輸入機台名稱';inp.value='';return}
  const msgs=()=>[...document.querySelectorAll(`[data-isomsg="${CSS.escape(tkey(t))}"]`),...(isNew&&$('isoNewMsg')?[$('isoNewMsg')]:[])];const say=m=>msgs().forEach(x=>x.textContent=m);
  const files=[...inp.files];inp.disabled=true;let ok=0;
  for(const [i,f] of files.entries()){if(f.size>20*1024*1024){say(`${f.name} 超過 20MB，略過`);continue}say(`上傳中 ${i+1}/${files.length}：${f.name}`);
    try{const r=await fetch('api/iso',{method:'POST',headers:{'content-type':f.type||'application/octet-stream','x-tool':encodeURIComponent(t),'x-name':encodeURIComponent(f.name),'x-cat':inp.dataset.cat||'iso','x-by':encodeURIComponent(WHO||'')},body:f});
      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));D.iso=D.iso||{};D.iso[j.id]=j.meta;PEND.iso[j.id]={v:j.meta,t:Date.now()};for(const g of j.replaced||[]){delete D.iso[g];PEND.iso[g]={v:null,t:Date.now()}}ok++}
    catch(err){say(`${f.name} 上傳失敗：${err.message}`);inp.disabled=false;return}}
  inp.disabled=false;render();updBadge();say(`已匯入 ${ok} 個檔案`)});
document.addEventListener('click',async e=>{const ta=e.target.closest('[data-isotask]');if(ta){const id=ta.dataset.isotask;
    ta.parentElement.innerHTML=`<input data-isotin="${esc(id)}" value="${esc(ta.dataset.t)}" style="width:150px;padding:3px 6px;font:.8rem var(--mono)" aria-label="改成哪台機台"><button class="btn small primary" data-isotok="${esc(id)}">確定</button>`;return}
  const ok=e.target.closest('[data-isotok]');if(ok){const id=ok.dataset.isotok;const v=document.querySelector(`[data-isotin="${CSS.escape(id)}"]`).value.trim().toUpperCase();if(!v)return;ok.disabled=true;
    try{const cur=(D.iso||{})[id]||{};const r=await call('api/iso/'+id,'PATCH',{t:v});D.iso[r.id]=r.meta;PEND.iso[r.id]={v:r.meta,t:Date.now()};for(const g of r.replaced||[]){delete D.iso[g];PEND.iso[g]={v:null,t:Date.now()}}render();updBadge()}catch(err){ok.disabled=false;ok.textContent='失敗：'+err.message}return}
  const mv=e.target.closest('[data-isomv]');if(!mv)return;mv.disabled=true;
  try{const r=await call('api/iso/'+mv.dataset.isomv,'PATCH',{c:mv.dataset.c});D.iso[r.id]=r.meta;PEND.iso[r.id]={v:r.meta,t:Date.now()};render();updBadge()}catch(err){mv.disabled=false;mv.textContent='失敗：'+err.message}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-isodel]');if(!b)return;if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='再按一次確定';return}
  b.disabled=true;try{await call('api/iso/'+b.dataset.isodel,'DELETE');delete D.iso[b.dataset.isodel];PEND.iso[b.dataset.isodel]={v:null,t:Date.now()};render();updBadge()}catch(err){b.disabled=false;b.textContent='失敗：'+err.message}});
syncBtns();load().then(()=>{if(EDIT)setEdit(true);loadJobs();loadSvy()});
</script>
